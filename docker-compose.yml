services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Письма и push server только ставит в очередь outbox, отправляет сервис notifier: SMTP и приватный ключ VAPID
      # есть только у него (docs/notification-queue-plan.md). Серверу нужен публичный ключ: браузер просит его для подписки.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      # администраторы сервиса (раздел «Сервис» в профиле), email через запятую
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # адрес сайта для ссылок в письмах-приглашениях: PUBLIC_URL или https://DOMAIN
      PUBLIC_URL: ${PUBLIC_URL:-}
      DOMAIN: ${DOMAIN:-}
      SMARTCAPTCHA_CLIENT_KEY: ${SMARTCAPTCHA_CLIENT_KEY:-}
      SMARTCAPTCHA_SERVER_KEY: ${SMARTCAPTCHA_SERVER_KEY:-}
      # дневной лимит писем: тот же, что у notifier (по нему API отказывает, когда бюджет исчерпан)
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-2800}
      # фото в чатах: без обоих секретов отправка фото выключена (текст работает); подробности в docs/chat-photos-plan.md
      MEDIA_URL: http://media:3000
      MEDIA_SECRET: ${MEDIA_SECRET:-}
      MEDIA_INTERNAL_TOKEN: ${MEDIA_INTERNAL_TOKEN:-}
      MEDIA_QUOTA_BYTES: ${MEDIA_QUOTA_BYTES:-}
    depends_on:
      db:
        condition: service_healthy

  # отправка писем (SMTP, по умолчанию Mailpit из профиля dev-mail) и push из очереди outbox; портов нет,
  # живость проверяется по метке в БД
  notifier:
    build: ./notifier
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Моя Семья <noreply@family-tasks.local>}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@family-tasks.local}
      # лимиты провайдеров (подробности в .env.example)
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-2800}
      MAIL_RATE_PER_SECOND: ${MAIL_RATE_PER_SECOND:-2}
      PUSH_RATE_PER_SECOND: ${PUSH_RATE_PER_SECOND:-50}
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # схему очереди создаёт миграция server; если notifier стартует раньше, он ждёт и пробует снова
    depends_on:
      db:
        condition: service_healthy

  # планировщик уведомлений: раз в минуту решает, кому что напомнить (дни рождения, уроки, тренировки), и ставит
  # сообщения в очередь outbox; портов нет, живость проверяется по метке в БД (docs/scheduler-service-plan.md)
  scheduler:
    build: ./scheduler
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # без публичного ключа VAPID уведомления выключены, как у server
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # схему создаёт миграция server; если scheduler стартует раньше, он ждёт и пробует снова
    depends_on:
      db:
        condition: service_healthy

  # хранилище файлов (S3-совместимое, SeaweedFS одним контейнером): фото из чатов; портов наружу нет, ходит к нему только media.
  # Ключи доступа берутся из .env при каждом запуске. После перезапуска хранилищу нужно до получаса, чтение в это время даёт 500,
  # поэтому media при старте создаёт бакет с повторами (docs/chat-photos-plan.md)
  s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"media","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data -volume.max=100
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mediakey}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-mediasecret}
    volumes:
      - s3data:/data

  # обработка и выдача фото: принимает от server, перекодирует, хранит в s3, отдаёт по подписанным ссылкам (/media/ через nginx)
  media:
    build: ./media
    restart: unless-stopped
    environment:
      PORT: 3000
      MEDIA_SECRET: ${MEDIA_SECRET:-}
      MEDIA_INTERNAL_TOKEN: ${MEDIA_INTERNAL_TOKEN:-}
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mediakey}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-mediasecret}
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      - s3

  # локальный SMTP-приёмник, письма смотрим на http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    profiles: [dev-mail]
    restart: unless-stopped
    ports:
      - "8025:8025"

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server

volumes:
  pgdata:
  s3data:
