services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # по умолчанию письма уходят в Mailpit (профиль dev-mail); в проде задайте SMTP_* в .env
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Моя Семья <noreply@family-tasks.local>}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@family-tasks.local}
      # администраторы сервиса (раздел «Сервис» в профиле), email через запятую
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # true: письма и push кладутся в очередь outbox, отправляет сервис notifier (docs/notification-queue-plan.md)
      QUEUE_ENABLED: ${QUEUE_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy

  # отправка писем и push из очереди outbox; портов нет, живость проверяется по метке в БД
  notifier:
    build: ./notifier
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Моя Семья <noreply@family-tasks.local>}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@family-tasks.local}
      # лимиты провайдеров (подробности в .env.example)
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-2800}
      MAIL_RATE_PER_SECOND: ${MAIL_RATE_PER_SECOND:-2}
      PUSH_RATE_PER_SECOND: ${PUSH_RATE_PER_SECOND:-50}
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # схему очереди создаёт миграция server; если notifier стартует раньше, он ждёт и пробует снова
    depends_on:
      db:
        condition: service_healthy

  # локальный SMTP-приёмник, письма смотрим на http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    profiles: [dev-mail]
    restart: unless-stopped
    ports:
      - "8025:8025"

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server

volumes:
  pgdata:
