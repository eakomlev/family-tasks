# Журналы контейнеров: не больше 3 файлов по 10 МБ на сервис (без этого они растут без предела и забивают диск сервера)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *logging
    image: postgres:17-alpine
    restart: unless-stopped
    # потолок памяти: Postgres не должен съесть сервер; при превышении Docker убьёт только этот контейнер (restart поднимет)
    mem_limit: 2g
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    logging: *logging
    build: ./server
    restart: unless-stopped
    mem_limit: 1g
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Письма и push server только ставит в очередь outbox, отправляет сервис notifier: SMTP и приватный ключ VAPID
      # есть только у него (docs/notification-queue-plan.md). Серверу нужен публичный ключ: браузер просит его для подписки.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      # push на телефон приложения: серверу нужен только признак, ключ сервисного аккаунта у notifier
      FCM_ENABLED: ${FCM_ENABLED:-}
      APNS_ENABLED: ${APNS_ENABLED:-}
      # администраторы сервиса (раздел «Сервис» в профиле), email через запятую
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # адрес сайта для ссылок в письмах-приглашениях: PUBLIC_URL или https://DOMAIN
      PUBLIC_URL: ${PUBLIC_URL:-}
      DOMAIN: ${DOMAIN:-}
      SMARTCAPTCHA_CLIENT_KEY: ${SMARTCAPTCHA_CLIENT_KEY:-}
      SMARTCAPTCHA_SERVER_KEY: ${SMARTCAPTCHA_SERVER_KEY:-}
      # дневной лимит писем: тот же, что у notifier (по нему API отказывает, когда бюджет исчерпан)
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-2800}
      # фото в чатах: без обоих секретов отправка фото выключена (текст работает); подробности в docs/chat-photos-plan.md
      MEDIA_URL: http://media:3000
      MEDIA_SECRET: ${MEDIA_SECRET:-}
      MEDIA_INTERNAL_TOKEN: ${MEDIA_INTERNAL_TOKEN:-}
      MEDIA_QUOTA_BYTES: ${MEDIA_QUOTA_BYTES:-}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-}
      MAX_VIDEO_BYTES: ${MAX_VIDEO_BYTES:-}
      # сколько видео сжимается одновременно (остальным «занято, попробуйте позже»)
      MEDIA_MAX_ACTIVE_VIDEOS: ${MEDIA_MAX_ACTIVE_VIDEOS:-}
    depends_on:
      db:
        condition: service_healthy

  # отправка писем (SMTP, по умолчанию Mailpit из профиля dev-mail) и push из очереди outbox; портов нет,
  # живость проверяется по метке в БД
  notifier:
    logging: *logging
    build: ./notifier
    restart: unless-stopped
    mem_limit: 256m
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Моя Семья <noreply@family-tasks.local>}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@family-tasks.local}
      # Firebase Cloud Messaging (push в приложение на Android): ключ сервисного аккаунта одной строкой base64
      FCM_SERVICE_ACCOUNT_BASE64: ${FCM_SERVICE_ACCOUNT_BASE64:-}
      # Apple Push Notification service (push на iPhone): ключ .p8 одной строкой base64, его идентификатор, команда и bundle id
      APNS_KEY_BASE64: ${APNS_KEY_BASE64:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-ru.familytasks.mobile}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-true}
      # лимиты провайдеров (подробности в .env.example)
      MAIL_DAILY_LIMIT: ${MAIL_DAILY_LIMIT:-2800}
      MAIL_RATE_PER_SECOND: ${MAIL_RATE_PER_SECOND:-2}
      PUSH_RATE_PER_SECOND: ${PUSH_RATE_PER_SECOND:-50}
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # схему очереди создаёт миграция server; если notifier стартует раньше, он ждёт и пробует снова
    depends_on:
      db:
        condition: service_healthy

  # живые обновления: держит WebSocket-соединения (/api/ws через nginx), слушает канал Postgres «realtime», в который пишет server,
  # и рассылает сигналы клиентам; портов наружу нет, живость проверяется по метке в БД
  realtime:
    logging: *logging
    build: ./realtime
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # схему создаёт миграция server; если realtime стартует раньше, он ждёт и пробует снова
    depends_on:
      db:
        condition: service_healthy

  # планировщик уведомлений: раз в минуту решает, кому что напомнить (дни рождения, уроки, тренировки), и ставит
  # сообщения в очередь outbox; портов нет, живость проверяется по метке в БД (docs/scheduler-service-plan.md)
  scheduler:
    logging: *logging
    build: ./scheduler
    restart: unless-stopped
    mem_limit: 256m
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # без публичного ключа VAPID и без FCM_ENABLED уведомления выключены, как у server
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      FCM_ENABLED: ${FCM_ENABLED:-}
      APNS_ENABLED: ${APNS_ENABLED:-}
      # удаление семьи: сначала файлы в сервисе media, потом данные в базе
      MEDIA_URL: http://media:3000
      MEDIA_INTERNAL_TOKEN: ${MEDIA_INTERNAL_TOKEN:-}
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # схему создаёт миграция server; если scheduler стартует раньше, он ждёт и пробует снова
    depends_on:
      db:
        condition: service_healthy

  # обработка и выдача фото: принимает от server, перекодирует, хранит в S3, отдаёт по подписанным ссылкам (/media/ через nginx)
  media:
    logging: *logging
    build: ./media
    restart: unless-stopped
    # в потолок входит и ffmpeg: без ограничения потоков он брал до 670 МБ на 4K и 370 МБ на 1080p (при 512 МБ его убивали), с `-threads 2`
    # около 190 МБ на 1080p; запас оставлен на ролики с телефона и на сам сервис
    mem_limit: 1g
    # сжатие занимает все ядра, на 6 ядрах сервера это тормозило бы остальные сервисы: не больше двух ядер (1080p в минуту сжимается за 10–20 секунд)
    cpus: 2
    environment:
      PORT: 3000
      MEDIA_SECRET: ${MEDIA_SECRET:-}
      MEDIA_INTERNAL_TOKEN: ${MEDIA_INTERNAL_TOKEN:-}
      MEDIA_MAX_FILE_BYTES: ${MAX_FILE_BYTES:-}
      MEDIA_MAX_VIDEO_BYTES: ${MAX_VIDEO_BYTES:-}
      MEDIA_MAX_VIDEO_SECONDS: ${MAX_VIDEO_SECONDS:-}
      # сжатие видео: потоков у ffmpeg (по умолчанию 2, чтобы не занять все ядра) и предел времени одной обработки, секунды
      MEDIA_FFMPEG_THREADS: ${MEDIA_FFMPEG_THREADS:-}
      MEDIA_FFMPEG_TIMEOUT_SECONDS: ${MEDIA_FFMPEG_TIMEOUT_SECONDS:-}
      # внешнее S3-хранилище (рег.ру): адрес, бакет и ключи из .env, без них media не запустится
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # локальный SMTP-приёмник, письма смотрим на http://localhost:8025
  mailpit:
    logging: *logging
    image: axllent/mailpit:latest
    profiles: [dev-mail]
    restart: unless-stopped
    ports:
      - "8025:8025"

  web:
    logging: *logging
    build: ./web
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server

volumes:
  pgdata:
