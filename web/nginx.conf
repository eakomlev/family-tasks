# За HTTPS-прокси (Caddy в prod) соединение приходит от него, а реальный адрес посетителя лежит в X-Forwarded-For.
# Доверяем этому заголовку только от адресов внутренних сетей Docker; от остальных он игнорируется,
# поэтому подставить чужой адрес для обхода лимитов запросов нельзя.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# для WebSocket: заголовок Connection зависит от того, просит ли клиент переключить протокол
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  # версию nginx наружу не показываем
  server_tokens off;
  include /etc/nginx/snippets/security-headers.conf;

  # Адрес сервера API берём через DNS Docker при каждом запросе (не раз при старте nginx): если контейнер `server`
  # упал и поднялся с новым внутренним адресом, запросы идут по новому адресу, а не отдают 502 до перезапуска web.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://server:3000;
  set $media_upstream http://media:3000;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

  # живые обновления по WebSocket: нужны HTTP/1.1 и заголовки Upgrade; сервер шлёт ping раз в 30 с, таймаут с запасом
  location = /api/ws {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # загрузка фото в чат: тело до 4 МБ (клиент уменьшает фото заранее, сервер принимает до 3 МБ); по умолчанию nginx пускает только 1 МБ
  location ~ ^/api/chats/[^/]+/media$ {
    client_max_body_size 4m;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # загрузка файла в чат (документ, архив…): сервер принимает до 10 МБ, nginx пускает с небольшим запасом
  location ~ ^/api/chats/[^/]+/files$ {
    client_max_body_size 11m;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # после real_ip $remote_addr уже настоящий адрес клиента; цепочку от клиента дальше не передаём
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # фото из чатов: отдаёт сервис media по подписанной ссылке (проверяет подпись сам). Только /media/: внутренний API
  # сервиса (/internal/) наружу не проксируется. Свои заголовки безопасности media не дублируем.
  location /media/ {
    proxy_pass $media_upstream;
    proxy_set_header Host $host;
    proxy_hide_header X-Content-Type-Options;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # манифест: правильный тип содержимого (по умолчанию nginx отдаёт octet-stream) и без кэша
  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # service worker и страница не должны кэшироваться, иначе PWA не обновится
  location ~* ^/(sw\.js|registerSW\.js|index\.html)$ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # файлы с хэшем в имени можно кэшировать надолго
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
