# Заголовки безопасности. Подключаются в server и в каждый location, где есть свой add_header
# (иначе nginx не наследует заголовки родителя). always: отдаём и на ответы с ошибками.
# CSP: скрипты и стили свои плюс inline (тема и запасной экран в index.html, styled-components); внешний ресурс один: Яндекс SmartCaptcha (скрипт, задание во фрейме) при отправке кода на почту.
# connect-src с ws/wss: часть версий Safari не считает 'self' разрешением для WebSocket на тот же адрес.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://smartcaptcha.cloud.yandex.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://smartcaptcha.cloud.yandex.ru; font-src 'self'; connect-src 'self' ws: wss: https://smartcaptcha.cloud.yandex.ru; frame-src https://smartcaptcha.cloud.yandex.ru; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
