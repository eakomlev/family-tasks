<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Safari не понимает SVG-значок вкладки и при наличии ссылки на него не ищет favicon.ico сам, поэтому ico и png указаны явно -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" sizes="any" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" sizes="192x192" />
    <!-- viewport-fit=cover: без него iOS не сообщает безопасные отступы (env(safe-area-inset-*)), и панель табов уходит под индикатор «Домой» и скруглённые углы -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f4ff" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- подпись под значком на «Домой» в iOS -->
    <meta name="apple-mobile-web-app-title" content="Моя Семья" />
    <title>Моя Семья</title>
    <!-- до первого рендера применяем сохранённую тему, чтобы не было вспышки; логика та же, что в src/lib/theme.ts -->
    <script>
      try {
        var saved = localStorage.getItem('theme')
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0b0e1f' : '#f1f4ff')
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- пока приложение грузится, вместо белого экрана надпись; если оно не запустилось, ниже скрипт покажет причину -->
    <div id="root"><div id="boot" style="padding:3rem 1rem;text-align:center;font-family:system-ui,sans-serif;color:#6b6a80">Моя Семья<br />Загрузка…</div></div>
    <script>
      // Запасной экран на случай, когда приложение не запустилось (ошибка скрипта, зависшая загрузка, застрявший кэш).
      // Написан без современного синтаксиса, чтобы работать и на старых телефонах.
      ;(function () {
        var shown = false
        // что известно о запуске: по этим строкам видно, где остановилось (сеть, кэш, скрипт)
        function details() {
          var lines = []
          lines.push('онлайн: ' + (navigator.onLine ? 'да' : 'нет'))
          lines.push('этап: ' + (window.__bootStage || 'главный скрипт не выполнился'))
          lines.push('service worker: ' + (navigator.serviceWorker && navigator.serviceWorker.controller ? 'управляет страницей' : 'нет'))
          try {
            var res = performance.getEntriesByType('resource')
            var found = false
            for (var i = 0; i < res.length; i++) {
              if (/\/assets\/|registerSW/.test(res[i].name)) {
                found = true
                lines.push(res[i].name.split('/').pop() + ': ' + Math.round(res[i].duration) + ' мс, ' + (res[i].transferSize || 0) + ' байт')
              }
            }
            if (!found) lines.push('файлы приложения: загрузка не завершилась')
          } catch (e) {}
          var c = navigator.connection
          if (c) lines.push('сеть: ' + (c.effectiveType || '?') + (c.downlink ? ', ' + c.downlink + ' Мбит/с' : ''))
          lines.push(navigator.userAgent)
          return lines.join('\n')
        }
        // Проверка скачивания главного скрипта: сколько байт из скольких пришло за 8 секунд.
        // Если получено сильно меньше заявленного, соединение обрывается или зависает по дороге (сеть, MTU, фильтрация).
        function probe(pre) {
          try {
            var el = document.querySelector('script[type=module][src]')
            if (!el || !window.fetch || !window.AbortController) return
            var ctrl = new AbortController()
            var got = 0
            var total = 0
            var timer = setTimeout(function () { ctrl.abort() }, 8000)
            var report = function (note) {
              pre.textContent += '\nпроверка скрипта: получено ' + got + ' из ' + (total || '?') + ' байт, ' + note
            }
            fetch(el.src, { cache: 'no-store', signal: ctrl.signal }).then(function (res) {
              total = Number(res.headers.get('content-length')) || 0
              var type = res.headers.get('content-type') || '?'
              if (!res.body || !res.body.getReader) {
                clearTimeout(timer)
                return res.text().then(function (t) { got = t.length; report('HTTP ' + res.status + ', ' + type) })
              }
              var reader = res.body.getReader()
              var pump = function () {
                return reader.read().then(function (r) {
                  if (r.done) { clearTimeout(timer); report('HTTP ' + res.status + ', ' + type + ', скачан полностью') ; return }
                  got += r.value.length
                  return pump()
                })
              }
              return pump()
            }).catch(function (e) {
              clearTimeout(timer)
              report(e && e.name === 'AbortError' ? 'зависло, прервано через 8 с' : 'ошибка: ' + (e && e.message))
            })
          } catch (e) {}
        }
        function fail(reason) {
          if (shown) return
          var boot = document.getElementById('boot')
          if (!boot) return // приложение уже нарисовалось, дальше его ErrorBoundary
          shown = true
          boot.innerHTML =
            '<p style="font-size:1.1rem;color:inherit">Приложение не запустилось</p>' +
            '<p style="font-size:.85rem;overflow-wrap:anywhere"></p>' +
            '<button type="button" style="padding:.8rem 1.2rem;border:0;border-radius:.8rem;background:#4b3bff;color:#fff;font-size:1rem">Сбросить и перезагрузить</button>' +
            '<pre style="margin:1.2rem 0 0;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.7rem"></pre>'
          boot.getElementsByTagName('p')[1].textContent = reason
          var pre = boot.getElementsByTagName('pre')[0]
          pre.textContent = details()
          probe(pre)
          boot.getElementsByTagName('button')[0].onclick = function () {
            var done = function () { location.reload() }
            try {
              var jobs = []
              if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                jobs.push(navigator.serviceWorker.getRegistrations().then(function (list) {
                  return Promise.all(list.map(function (r) { return r.unregister() }))
                }))
              }
              if (window.caches) {
                jobs.push(caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k) }))
                }))
              }
              Promise.all(jobs).then(done, done)
            } catch (e) { done() }
          }
        }
        window.addEventListener('error', function (e) {
          fail((e.message || 'Ошибка') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''))
        })
        setTimeout(function () {
          fail('Страница не загрузилась за 15 секунд. Проверьте связь или сбросьте кэш.')
        }, 15000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
