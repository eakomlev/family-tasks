<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7fb" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- подпись под значком на «Домой» в iOS -->
    <meta name="apple-mobile-web-app-title" content="Моя семья" />
    <title>Моя семья</title>
    <!-- до первого рендера применяем сохранённую тему, чтобы не было вспышки; логика та же, что в src/lib/theme.ts -->
    <script>
      try {
        var saved = localStorage.getItem('theme')
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#14131f' : '#f7f7fb')
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- пока приложение грузится, вместо белого экрана надпись; если оно не запустилось, ниже скрипт покажет причину -->
    <div id="root"><div id="boot" style="padding:3rem 1rem;text-align:center;font-family:system-ui,sans-serif;color:#6b6a80">Моя семья<br />Загрузка…</div></div>
    <script>
      // Запасной экран на случай, когда приложение не запустилось (ошибка скрипта, зависшая загрузка, застрявший кэш).
      // Написан без современного синтаксиса, чтобы работать и на старых телефонах.
      ;(function () {
        var shown = false
        // что известно о запуске: по этим строкам видно, где остановилось (сеть, кэш, скрипт)
        function details() {
          var lines = []
          lines.push('онлайн: ' + (navigator.onLine ? 'да' : 'нет'))
          lines.push('этап: ' + (window.__bootStage || 'главный скрипт не выполнился'))
          lines.push('service worker: ' + (navigator.serviceWorker && navigator.serviceWorker.controller ? 'управляет страницей' : 'нет'))
          try {
            var res = performance.getEntriesByType('resource')
            var found = false
            for (var i = 0; i < res.length; i++) {
              if (/\/assets\/|registerSW/.test(res[i].name)) {
                found = true
                lines.push(res[i].name.split('/').pop() + ': ' + Math.round(res[i].duration) + ' мс, ' + (res[i].transferSize || 0) + ' байт')
              }
            }
            if (!found) lines.push('файлы приложения: загрузка не завершилась')
          } catch (e) {}
          var c = navigator.connection
          if (c) lines.push('сеть: ' + (c.effectiveType || '?') + (c.downlink ? ', ' + c.downlink + ' Мбит/с' : ''))
          lines.push(navigator.userAgent)
          return lines.join('\n')
        }
        function fail(reason) {
          if (shown) return
          var boot = document.getElementById('boot')
          if (!boot) return // приложение уже нарисовалось, дальше его ErrorBoundary
          shown = true
          boot.innerHTML =
            '<p style="font-size:1.1rem;color:inherit">Приложение не запустилось</p>' +
            '<p style="font-size:.85rem;overflow-wrap:anywhere"></p>' +
            '<button type="button" style="padding:.8rem 1.2rem;border:0;border-radius:.8rem;background:#4f46e5;color:#fff;font-size:1rem">Сбросить и перезагрузить</button>' +
            '<pre style="margin:1.2rem 0 0;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.7rem"></pre>'
          boot.getElementsByTagName('p')[1].textContent = reason
          boot.getElementsByTagName('pre')[0].textContent = details()
          boot.getElementsByTagName('button')[0].onclick = function () {
            var done = function () { location.reload() }
            try {
              var jobs = []
              if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                jobs.push(navigator.serviceWorker.getRegistrations().then(function (list) {
                  return Promise.all(list.map(function (r) { return r.unregister() }))
                }))
              }
              if (window.caches) {
                jobs.push(caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k) }))
                }))
              }
              Promise.all(jobs).then(done, done)
            } catch (e) { done() }
          }
        }
        window.addEventListener('error', function (e) {
          fail((e.message || 'Ошибка') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''))
        })
        setTimeout(function () {
          fail('Страница не загрузилась за 15 секунд. Проверьте связь или сбросьте кэш.')
        }, 15000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
