# Для разработки: поднимает БД и Mailpit и пробрасывает их порты на хост.
# Сервер и фронтенд запускаются локально (npm run dev), см. README.
services:
  db:
    ports:
      - "5432:5432"

  mailpit:
    profiles: []
    ports:
      - "1025:1025"

  # хранилище файлов для тестов media и локальной работы
  s3:
    ports:
      - "8333:8333"
